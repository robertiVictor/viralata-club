<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Solicitações - ViraLata Club</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="loading" class="loading-overlay" style="display:none;">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Carregando...</span></div>
  </div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;"></div>

  <!-- Banner de atualização em tempo real -->
  <div id="ws-banner" class="d-none" style="background:var(--primary-light);border-bottom:2px solid var(--primary-mid);padding:10px 20px;">
    <div class="container d-flex align-items-center gap-2">
      <span class="badge rounded-pill" style="background:var(--primary);font-size:.7rem;">AO VIVO</span>
      <i class="bi bi-broadcast" style="color:var(--primary)"></i>
      <span class="text-muted small">Suas solicitações são atualizadas em tempo real via WebSocket.</span>
      <span id="ws-status" class="ms-auto small text-muted"></span>
    </div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/"><span class="brand-logo-icon"><i class="bi bi-heart-fill"></i></span><span>ViraLata Club</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/pets.html">Pets</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/saiba-mais.html">Saiba Mais</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/sobre-nos.html">Sobre Nós</a></li>
        </ul>
        <ul class="navbar-nav" id="nav-auth"></ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h2 class="mb-0">Minhas Solicitações de Adoção</h2>
      <button class="btn btn-sm btn-outline-secondary" onclick="carregarAdocoes()">
        <i class="bi bi-arrow-clockwise me-1"></i>Atualizar
      </button>
    </div>
    <div id="adocoes-list">
      <div class="text-center py-5">
        <div class="spinner-border" style="color:var(--primary)" role="status"></div>
      </div>
    </div>
  </div>

  <footer class="text-center">
    <div class="container"><p class="mb-0">&copy; 2026 ViraLata Club.</p></div>
  </footer>

  <!-- Socket.IO client -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function carregarAdocoes() {
      const container = document.getElementById('adocoes-list');
      try {
        const res = await apiRequest('/adocoes/minhas');
        const adocoes = res.data;

        if (adocoes.length === 0) {
          container.innerHTML = `
            <div class="text-center text-muted py-5">
              <i class="bi bi-inbox fs-1 d-block mb-3" style="color:var(--primary-mid)"></i>
              Você ainda não enviou nenhuma solicitação de adoção.
            </div>`;
          return;
        }

        container.innerHTML = `
          <div class="table-responsive">
            <table class="table table-hover bg-white rounded shadow-sm" id="adocoes-table">
              <thead class="table-light">
                <tr>
                  <th>Pet</th><th>Espécie</th><th>Status</th><th>Mensagem</th><th>Data</th>
                </tr>
              </thead>
              <tbody>
                ${adocoes.map(a => `
                  <tr id="row-${a.id}">
                    <td>
                      <a href="/pages/pet-detail.html?id=${a.pet_id}" class="text-decoration-none fw-semibold">
                        ${a.pet_nome}
                      </a>
                    </td>
                    <td>${a.especie}</td>
                    <td id="status-${a.id}">${statusBadge(a.status)}</td>
                    <td>${a.mensagem || '—'}</td>
                    <td>${new Date(a.created_at).toLocaleDateString('pt-BR')}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`;
      } catch (err) {
        container.innerHTML = '<div class="text-center text-danger py-4">Erro ao carregar solicitações.</div>';
      }
    }

    // ── WebSocket: atualização em tempo real ────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      if (!isLoggedIn()) { window.location.href = '/pages/login.html'; return; }

      await carregarAdocoes();

      const user = getUser();
      if (!user) return;

      document.getElementById('ws-banner').classList.remove('d-none');

      const socket = io({ query: { userId: user.id } });

      socket.on('connect', () => {
        document.getElementById('ws-status').innerHTML =
          '<i class="bi bi-circle-fill me-1" style="color:var(--success);font-size:.6rem"></i>Conectado';
      });

      socket.on('disconnect', () => {
        document.getElementById('ws-status').innerHTML =
          '<i class="bi bi-circle-fill me-1" style="color:var(--danger);font-size:.6rem"></i>Desconectado';
      });

      // Evento emitido pelo worker (após processar fila) ou pelo admin (aprovar/rejeitar)
      socket.on('adocao:atualizada', (data) => {
        // Atualiza o badge de status na linha correspondente
        const statusCell = document.getElementById(`status-${data.adocao_id}`);
        if (statusCell) {
          statusCell.innerHTML = statusBadge(data.status);
          // Destaque visual na linha
          const row = document.getElementById(`row-${data.adocao_id}`);
          if (row) {
            row.style.transition = 'background 0.5s';
            row.style.background = '#fffbeb';
            setTimeout(() => { row.style.background = ''; }, 2500);
          }
        }

        // Toast com a mensagem do servidor
        const tipo = data.status === 'aprovada' ? 'success' : 'error';
        showToast(data.mensagem, tipo === 'success' ? 'success' : 'error');

        // Se aprovada, recarrega para garantir dados atualizados
        if (data.status === 'aprovada' || data.status === 'rejeitada') {
          setTimeout(carregarAdocoes, 1500);
        }
      });
    });
  </script>
</body>
</html>
