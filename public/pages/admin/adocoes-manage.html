<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitações de Adoção - ViraLata Club</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="loading" class="loading-overlay" style="display:none;">
    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Carregando...</span></div>
  </div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;"></div>

  <nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/"><span class="brand-logo-icon"><i class="bi bi-heart-fill"></i></span><span>ViraLata Club</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Menu de navegação">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto"><li class="nav-item"><a class="nav-link" href="/">Site</a></li></ul>
        <ul class="navbar-nav" id="nav-auth"></ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <nav class="col-md-3 col-lg-2 d-md-block admin-sidebar py-3">
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="/pages/admin/dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/admin/pets-manage.html"><i class="bi bi-heart me-2"></i>Gerenciar Pets</a></li>
          <li class="nav-item"><a class="nav-link active" href="/pages/admin/adocoes-manage.html"><i class="bi bi-clipboard-check me-2"></i>Solicitações</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/admin/users-manage.html"><i class="bi bi-people me-2"></i>Usuários</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/admin/notificacoes.html"><i class="bi bi-bell me-2"></i>Notificações</a></li>
        </ul>
      </nav>

      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        <h2 class="mb-4">Solicitações de Adoção</h2>
        <div class="table-responsive">
          <table class="table table-hover bg-white rounded shadow-sm">
            <thead class="table-light">
              <tr><th>Pet</th><th>Adotante</th><th>Status</th><th>Data</th><th class="text-end">Ações</th></tr>
            </thead>
            <tbody id="adocoes-tbody">
              <tr><td colspan="5" class="text-center text-muted">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let adocoesData = [];

    const PERGUNTAS_LABELS = {
      q_experiencia:    'Tem experiência com animais?',
      q_moradores:      'Todos os moradores concordam?',
      q_outros_animais: 'Tem outros animais em casa?',
      q_criancas:       'Há crianças menores de 10 anos?',
      q_area_externa:   'O animal terá espaço para se movimentar?',
      q_ciente_custos:  'Ciente dos custos (ração, vet, higiene)?',
      q_compromisso:    'Compromete-se a nunca abandonar o animal?',
    };

    function renderArquivo(url, label) {
      if (!url) return `<span class="text-muted small">Não enviado</span>`;
      const isPdf = url.toLowerCase().endsWith('.pdf');
      return isPdf
        ? `<a href="${url}" target="_blank" class="btn btn-sm btn-outline-secondary"><i class="bi bi-file-earmark-pdf me-1"></i>${label}</a>`
        : `<a href="${url}" target="_blank"><img src="${url}" alt="${label}" class="img-thumbnail" style="max-height:120px;"></a>`;
    }

    async function carregarAdocoes() {
      try {
        const res = await apiRequest('/adocoes');
        adocoesData = res.data;
        const tbody = document.getElementById('adocoes-tbody');

        if (adocoesData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Nenhuma solicitação.</td></tr>';
          return;
        }

        tbody.innerHTML = adocoesData.map(a => `
          <tr>
            <td class="fw-semibold">${a.pet_nome}</td>
            <td>${a.adotante_nome}</td>
            <td>${statusBadge(a.status)}</td>
            <td>${new Date(a.created_at).toLocaleDateString('pt-BR')}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-1" onclick="verDetalhes('${a.id}')" title="Ver detalhes"><i class="bi bi-eye"></i></button>
              ${(a.status === 'pendente' || a.status === 'em_analise') ? `
                <button class="btn btn-sm btn-success me-1" onclick="aprovar('${a.id}')" title="Aprovar"><i class="bi bi-check-lg"></i></button>
                <button class="btn btn-sm btn-danger" onclick="rejeitar('${a.id}')" title="Rejeitar"><i class="bi bi-x-lg"></i></button>
              ` : ''}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        showToast('Erro ao carregar solicitações', 'error');
      }
    }

    function verDetalhes(id) {
      const a = adocoesData.find(x => x.id === id);
      if (!a) return;

      // Coluna esquerda: info + mensagem
      document.getElementById('det-info').innerHTML = `
        <table class="table table-sm">
          <tr><th style="width:110px">Pet</th><td class="fw-semibold">${a.pet_nome}</td></tr>
          <tr><th>Adotante</th><td>${a.adotante_nome}</td></tr>
          <tr><th>E-mail</th><td>${a.adotante_email}</td></tr>
          <tr><th>Telefone</th><td>${a.adotante_telefone || '—'}</td></tr>
          <tr><th>Status</th><td>${statusBadge(a.status)}</td></tr>
          <tr><th>Data</th><td>${new Date(a.created_at).toLocaleDateString('pt-BR')}</td></tr>
        </table>
        <div class="mt-3">
          <h6 class="fw-semibold">Mensagem</h6>
          <p class="text-muted small border rounded p-2" style="min-height:60px;white-space:pre-line;">${a.mensagem || '<em>Nenhuma mensagem enviada.</em>'}</p>
        </div>
      `;

      // Coluna direita: respostas + documentação
      const pergs = a.perguntas || {};
      const pergHtml = Object.entries(PERGUNTAS_LABELS).map(([k, label]) => {
        const val = pergs[k];
        const icon = val === true  ? '<i class="bi bi-check-circle-fill text-success me-2"></i>'
                   : val === false ? '<i class="bi bi-x-circle-fill text-danger me-2"></i>'
                   : '<i class="bi bi-dash-circle text-muted me-2"></i>';
        return `<li class="list-group-item border-0 px-0 py-1 small">${icon}${label}</li>`;
      }).join('');

      document.getElementById('det-dir').innerHTML = `
        <h6 class="fw-semibold">Respostas do Questionário</h6>
        <ul class="list-group list-group-flush mb-4">${pergHtml}</ul>
        <h6 class="fw-semibold">Documentação</h6>
        <div class="d-flex flex-wrap gap-3">
          <div>
            <div class="text-muted small mb-1">Documento de Identidade</div>
            ${renderArquivo(a.doc_identidade_url, 'Ver Documento')}
          </div>
          <div>
            <div class="text-muted small mb-1">Foto do Local</div>
            ${renderArquivo(a.foto_local_url, 'Ver Foto')}
          </div>
        </div>
      `;

      // Botões de ação no rodapé
      const canAct = a.status === 'pendente' || a.status === 'em_analise';
      document.getElementById('det-btn-aprovar').style.display = canAct ? '' : 'none';
      document.getElementById('det-btn-rejeitar').style.display = canAct ? '' : 'none';
      document.getElementById('det-btn-aprovar').onclick = () => { bootstrap.Modal.getInstance(document.getElementById('detalheModal')).hide(); aprovar(id); };
      document.getElementById('det-btn-rejeitar').onclick = () => { bootstrap.Modal.getInstance(document.getElementById('detalheModal')).hide(); rejeitar(id); };

      new bootstrap.Modal(document.getElementById('detalheModal')).show();
    }

    async function aprovar(id) {
      showLoading();
      try {
        await apiRequest(`/adocoes/${id}/aprovar`, { method: 'PATCH' });
        showToast('Adoção aprovada!');
        carregarAdocoes();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        hideLoading();
      }
    }

    async function rejeitar(id) {
      showLoading();
      try {
        await apiRequest(`/adocoes/${id}/rejeitar`, { method: 'PATCH' });
        showToast('Adoção rejeitada.');
        carregarAdocoes();
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        hideLoading();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!isLoggedIn() || !isAdmin()) { window.location.href = '/pages/login.html'; return; }
      carregarAdocoes();
    });
  </script>

  <!-- Modal de Detalhes da Adoção -->
  <div class="modal fade" id="detalheModal" tabindex="-1" aria-labelledby="detalheModalLabel" aria-modal="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detalheModalLabel"><i class="bi bi-clipboard-check me-2"></i>Detalhes da Solicitação</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <div class="row g-4">
            <div class="col-md-5">
              <div id="det-info"></div>
            </div>
            <div class="col-md-7">
              <div id="det-dir"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
          <button type="button" class="btn btn-danger" id="det-btn-rejeitar"><i class="bi bi-x-circle me-1"></i>Rejeitar</button>
          <button type="button" class="btn btn-success" id="det-btn-aprovar"><i class="bi bi-check-circle me-1"></i>Aprovar</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
